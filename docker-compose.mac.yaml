version: '3.8'

# Zeude - Mac Local Setup
# Automatically loads credentials from .env in the same directory.
#
# Usage:
#   docker compose -f docker-compose.mac.yaml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: zeude-postgres
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_USER=zeude
      - POSTGRES_PASSWORD=zeude
      - POSTGRES_DB=zeude
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./zeude/dashboard/postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeude -d zeude"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    container_name: zeude-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=dev
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./zeude/dashboard/clickhouse/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.1
    container_name: zeude-otel-collector
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
    volumes:
      - ./zeude/dashboard/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped

  dashboard:
    build:
      context: ./zeude/dashboard
      dockerfile: Dockerfile
    container_name: zeude-dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=zeude
      - POSTGRES_PASSWORD=zeude
      - POSTGRES_DB=zeude
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=dev
      - CLICKHOUSE_DATABASE=default
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-sonnet-4}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
